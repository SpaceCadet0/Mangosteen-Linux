name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to create on this commit, e.g. v0.2.0 (leave empty for a plain build)
        required: false
        default: ''

permissions:
  contents: write # the release job attaches the AppImage and the .deb to a GitHub release when a v* tag is pushed

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng xvfb xdotool \
            python3-gi gir1.2-gtk-3.0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libegl1 libgl1 libpulse0 fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Translations
        run: python scripts/check_translations.py

      - name: Tests
        run: xvfb-run -a pytest

      - name: Drag detection under a virtual X server
        run: |
          xvfb-run -a python tests/xvfb_drag_scenario.py
          MANY=60 xvfb-run -a python tests/xvfb_drag_scenario.py
          xvfb-run -a python tests/xvfb_gtk_source_scenario.py
          xvfb-run -a python tests/xvfb_app_scenario.py

  package:
    needs: test
    runs-on: ubuntu-22.04 # the oldest glibc we support (2.35), so the packages run on newer systems too
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libgl1 libpulse0 libfuse2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Bundle
        run: packaging/build-bundle.sh

      - name: Smoke test the bundle
        run: |
          QT_QPA_PLATFORM=offscreen dist/mangosteen/mangosteen --version
          printf 'x' > /tmp/sample.txt
          QT_QPA_PLATFORM=offscreen dist/mangosteen/mangosteen --formats /tmp/sample.txt

      - name: .deb
        run: packaging/build-deb.sh

      - name: AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" packaging/build-appimage.sh

      - name: Smoke test the AppImage
        run: |
          printf 'x' > /tmp/sample.txt
          QT_QPA_PLATFORM=offscreen dist/Mangosteen-*-x86_64.AppImage --appimage-extract-and-run --formats /tmp/sample.txt
          ls -l dist/*.AppImage dist/*.deb

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: |
            dist/*.AppImage
            dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mangosteen for Linux ${{ inputs.release || github.ref_name }}
          body_path: docs/releases/${{ inputs.release || github.ref_name }}.md
          files: |
            dist/*.AppImage
            dist/*.deb
